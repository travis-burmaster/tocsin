[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tocsin"
version = "0.1.0"
description = "Evidence-based security scanner for malware, known software vulnerabilities, and operating-system security posture."
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Security",
    "Environment :: Console",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tocsin = "tocsin.cli:main"

[project.urls]
Repository = "https://github.com/travis-burmaster/tocsin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tocsin = ["data/*.json"]
