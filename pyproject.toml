[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tocsin"
version = "0.1.0"
description = "Evidence-based security scanner for malware, known software vulnerabilities, and operating-system security posture."
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tocsin = "tocsin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
